name: GitHub member activity

on:
  workflow_dispatch:
    inputs:
      period:
        description: Completed period to collect
        required: true
        type: choice
        options: [weekly, monthly]
  schedule:
    - cron: '15 1 * * 2'
    - cron: '30 1 2 * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: github-member-activity
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@6b9c6063abd4a2e6e5c9c6d6d0c7d25f4c0b0c21
      - name: Install locked environment
        run: uv sync --locked
      - name: Test
        run: uv run pytest
      - id: collect
        name: Collect and verify
        env:
          PUBLIC_GITHUB_TOKEN: ${{ secrets.PUBLIC_GITHUB_TOKEN }}
        run: |
          set -u
          receipt="$RUNNER_TEMP/github-member-activity-receipt.json"
          if [ -e "$receipt" ] || [ -L "$receipt" ]; then
            if [ -L "$receipt" ] || [ ! -f "$receipt" ] || [ "$(stat -c %h "$receipt")" != 1 ]; then
              echo "unsafe stale receipt" >&2
              echo 'exit_code=4' >> "$GITHUB_OUTPUT"
              echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rm -- "$receipt"
          fi
          if [ ! -f ./config.yaml ]; then
            echo 'production config.yaml is required; config.example.yaml is not an executable schedule configuration' >&2
            echo 'exit_code=2' >> "$GITHUB_OUTPUT"
            echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          uv run github-member-activity validate-config --config ./config.yaml --scheduled
          config_code=$?
          set -e
          if [ "$config_code" != 0 ]; then
            echo "exit_code=$config_code" >> "$GITHUB_OUTPUT"
            echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            selected_period="${{ inputs.period }}"
          elif [ "${{ github.event.schedule }}" = "15 1 * * 2" ]; then
            selected_period=weekly
          elif [ "${{ github.event.schedule }}" = "30 1 2 * *" ]; then
            selected_period=monthly
          else
            echo 'exit_code=4' >> "$GITHUB_OUTPUT"
            echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          uv run github-member-activity collect --config ./config.yaml --period "$selected_period" --scheduled --receipt-path "$receipt"
          collector_code=$?
          set -e
          echo "collector_exit_code=$collector_code" >> "$GITHUB_OUTPUT"
          if [ ! -f "$receipt" ] || [ -L "$receipt" ] || [ "$(stat -c %h "$receipt")" != 1 ]; then
            echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"
            echo "exit_code=$([ "$collector_code" = 2 ] && echo 2 || echo 4)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          receipt_values="$(python - <<'PY'
          import json, os, pathlib, re, sys
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'github-member-activity-receipt.json'
          try:
              value = json.loads(path.read_text(encoding='utf-8'))
              keys = {'schema_version','period_id','period_utc_slug','run_id','run_dir','manifest_sha256'}
              if set(value) != keys or value['schema_version'] != '1.0' or any(not isinstance(value[key], str) or not value[key] for key in keys):
                  raise ValueError
              if not re.fullmatch(r'[0-9a-f]{64}', value['manifest_sha256']):
                  raise ValueError
              print(value['run_dir'] + '|' + value['manifest_sha256'] + '|' + value['period_id'] + '|' + value['period_utc_slug'])
          except Exception:
              sys.exit(1)
          PY
          )" || { echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"; echo 'exit_code=4' >> "$GITHUB_OUTPUT"; exit 0; }
          IFS='|' read -r artifact_path manifest_sha period_id period_utc_slug <<< "$receipt_values"
          set +e
          uv run github-member-activity verify --run-dir "$artifact_path" --expected-manifest-sha256 "$manifest_sha"
          verify_code=$?
          set -e
          if [ "$collector_code" = 0 ] && [ "$verify_code" = 0 ]; then
            :
          elif [ "$collector_code" = 3 ] && [ "$verify_code" = 3 ]; then
            :
          elif [ "$collector_code" = 4 ] && [ "$verify_code" = 3 ]; then
            :
          else
            echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"
            echo 'exit_code=4' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'artifact_ready=true' >> "$GITHUB_OUTPUT"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
          echo "period_id=$period_id" >> "$GITHUB_OUTPUT"
          echo "period_utc_slug=$period_utc_slug" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$manifest_sha" >> "$GITHUB_OUTPUT"
          echo "exit_code=$collector_code" >> "$GITHUB_OUTPUT"
      - name: Upload verified artifact
        id: upload
        if: always() && steps.collect.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-member-activity-${{ steps.collect.outputs.period_id }}-${{ steps.collect.outputs.period_utc_slug }}-${{ steps.collect.outputs.manifest_sha256 }}
          path: ${{ steps.collect.outputs.artifact_path }}
          if-no-files-found: error
      - name: Final gate
        if: always()
        run: |
          code="${{ steps.collect.outputs.exit_code || '4' }}"
          if [ "${{ steps.collect.outputs.artifact_ready }}" = 'true' ] && [ "${{ steps.upload.outcome }}" != 'success' ]; then
            code=4
          fi
          case "$code" in 0|2|3|4) exit "$code";; *) exit 4;; esac
