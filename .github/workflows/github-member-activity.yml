name: GitHub member activity

on:
  workflow_dispatch:
    inputs:
      period:
        description: Completed period to collect
        required: true
        type: choice
        options: [weekly, monthly]
  schedule:
    - cron: '15 1 * * 2'
    - cron: '30 1 2 * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: github-member-activity
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@6b9c6063abd4a2e6e5c9c6d6d0c7d25f4c0b0c21
      - name: Install locked environment
        run: uv sync --locked
      - name: Test
        run: uv run pytest
      - id: collect
        name: Collect and verify
        env:
          PUBLIC_GITHUB_TOKEN: ${{ secrets.PUBLIC_GITHUB_TOKEN }}
          PUBLIC_GITHUB_MEMBER_ACTIVITY_CONFIG: ${{ secrets.PUBLIC_GITHUB_MEMBER_ACTIVITY_CONFIG }}
        run: |
          set -u
          receipt="$RUNNER_TEMP/github-member-activity-receipt.json"
          if [ -e "$receipt" ] || [ -L "$receipt" ]; then
            if [ -L "$receipt" ] || [ ! -f "$receipt" ] || [ "$(stat -c %h "$receipt")" != 1 ]; then
              echo "unsafe stale receipt" >&2
              echo 'exit_code=4' >> "$GITHUB_OUTPUT"
              echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rm -- "$receipt"
          fi
          if [ ! -f ./config.yaml ]; then
            if [ -z "${PUBLIC_GITHUB_MEMBER_ACTIVITY_CONFIG:-}" ]; then
              echo 'production config.yaml or PUBLIC_GITHUB_MEMBER_ACTIVITY_CONFIG is required; config.example.yaml is not executable' >&2
              echo 'exit_code=2' >> "$GITHUB_OUTPUT"
              echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            umask 077
            printf '%s\n' "$PUBLIC_GITHUB_MEMBER_ACTIVITY_CONFIG" > ./config.yaml
          fi
          set +e
          uv run github-member-activity validate-config --config ./config.yaml --scheduled
          config_code=$?
          set -e
          if [ "$config_code" != 0 ]; then
            echo "exit_code=$config_code" >> "$GITHUB_OUTPUT"
            echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            selected_period="${{ inputs.period }}"
          elif [ "${{ github.event.schedule }}" = "15 1 * * 2" ]; then
            selected_period=weekly
          elif [ "${{ github.event.schedule }}" = "30 1 2 * *" ]; then
            selected_period=monthly
          else
            echo 'exit_code=4' >> "$GITHUB_OUTPUT"
            echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          uv run github-member-activity collect --config ./config.yaml --period "$selected_period" --scheduled --receipt-path "$receipt"
          collector_code=$?
          set -e
          echo "collector_exit_code=$collector_code" >> "$GITHUB_OUTPUT"
          if [ ! -f "$receipt" ] || [ -L "$receipt" ] || [ "$(stat -c %h "$receipt")" != 1 ]; then
            echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"
            echo "exit_code=$([ "$collector_code" = 2 ] && echo 2 || echo 4)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          receipt_values="$(uv run python - <<'PY'
          import json, os, pathlib, re, sys
          from github_member_activity.canonical import canonical_bytes
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'github-member-activity-receipt.json'
          try:
              raw = path.read_bytes()
              value = json.loads(raw[:-1].decode('utf-8'), object_pairs_hook=lambda pairs: {key: value for key, value in pairs} if len({key for key, _ in pairs}) == len(pairs) else (_ for _ in ()).throw(ValueError()), parse_constant=lambda _: (_ for _ in ()).throw(ValueError()))
              if not raw.endswith(b'\n') or canonical_bytes(value) + b'\n' != raw:
                  raise ValueError()
              keys = {'schema_version','period_id','period_utc_slug','run_id','run_dir','manifest_sha256'}
              if set(value) != keys or value['schema_version'] != '1.0' or any(not isinstance(value[key], str) or not value[key] for key in keys):
                  raise ValueError
              if not re.fullmatch(r'[0-9a-f]{64}', value['manifest_sha256']):
                  raise ValueError
              print(value['run_dir'] + '|' + value['manifest_sha256'] + '|' + value['period_id'] + '|' + value['period_utc_slug'] + '|' + value['run_id'])
          except Exception:
              sys.exit(1)
          PY
          )" || { echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"; echo 'exit_code=4' >> "$GITHUB_OUTPUT"; exit 0; }
          IFS='|' read -r artifact_path manifest_sha period_id period_utc_slug receipt_run_id <<< "$receipt_values"
          manifest_state="$(uv run python - "$artifact_path" "$manifest_sha" "$period_id" "$period_utc_slug" "$receipt_run_id" <<'PY'
          import hashlib, pathlib, sys
          from github_member_activity.config import load_config
          from github_member_activity.manifest import verify_directory
          path = pathlib.Path(sys.argv[1])
          if path.is_absolute() or not path.parts or '..' in path.parts or any(not part or part in {'.', '..'} for part in path.parts):
              raise SystemExit(1)
          config = load_config(pathlib.Path('config.yaml'))
          published_root = (pathlib.Path.cwd() / config.output.directory).resolve()
          diagnostic_root = (pathlib.Path.cwd() / 'diagnostics').resolve()
          resolved_path = path.resolve()
          try:
              published_rel = resolved_path.relative_to(published_root)
          except ValueError:
              published_rel = None
          try:
              diagnostic_rel = resolved_path.relative_to(diagnostic_root)
          except ValueError:
              diagnostic_rel = None
          if not ((published_rel is not None and len(published_rel.parts) == 2) or (diagnostic_rel is not None and len(diagnostic_rel.parts) == 1)):
              raise SystemExit(1)
          if any(component.is_symlink() for component in [pathlib.Path(*path.parts[:index]) for index in range(1, len(path.parts) + 1)]):
              raise SystemExit(1)
          manifest, _ = verify_directory(path)
          if manifest['run_id'] != sys.argv[5]:
              raise SystemExit(1)
          if manifest['run_status'] == 'published':
              if published_rel is None or published_rel.parts != (manifest['period']['id'], manifest['run_id']):
                  raise SystemExit(1)
          elif manifest['run_status'] == 'diagnostic':
              if diagnostic_rel is None or diagnostic_rel.parts != (manifest['run_id'],):
                  raise SystemExit(1)
          else:
              raise SystemExit(1)
          digest = hashlib.sha256((path / 'run-manifest.json').read_bytes()).hexdigest()
          if digest != sys.argv[2] or manifest['run_id'] != path.name or manifest['period']['id'] != sys.argv[3] or f"{manifest['period']['start_utc'].replace('-', '').replace(':', '').replace('T', 't').replace('Z', 'z')}--{manifest['period']['end_utc'].replace('-', '').replace(':', '').replace('T', 't').replace('Z', 'z')}" != sys.argv[4]:
              raise SystemExit(1)
          print(f"{manifest['run_status']}|{manifest['publishable']}|{manifest['run_reason'] or ''}|{manifest['validator_result']['status']}|{manifest['validator_result']['reason'] or ''}")
          PY
          )" || { echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"; echo 'exit_code=4' >> "$GITHUB_OUTPUT"; exit 0; }
          IFS='|' read -r manifest_status manifest_publishable manifest_reason manifest_validator manifest_validator_reason <<< "$manifest_state"
          if [ "$collector_code" = 0 ]; then
            [ "$manifest_status" = 'published' ] && [ "$manifest_publishable" = 'True' ] && [ -z "$manifest_reason" ] && [ "$manifest_validator" = 'passed' ] && [ -z "$manifest_validator_reason" ] || { echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"; echo 'exit_code=4' >> "$GITHUB_OUTPUT"; exit 0; }
          elif [ "$collector_code" = 3 ]; then
            [ "$manifest_status" = 'diagnostic' ] && [ "$manifest_publishable" = 'False' ] && [ "$manifest_validator" = 'not_run' ] && [ -z "$manifest_validator_reason" ] && { [ "$manifest_reason" = 'stability_gap_not_met' ] || [ "$manifest_reason" = 'no_applicable_members' ]; } || { echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"; echo 'exit_code=4' >> "$GITHUB_OUTPUT"; exit 0; }
          elif [ "$collector_code" = 4 ]; then
            state_ok=false
            if [ "$manifest_status" = 'diagnostic' ] && [ "$manifest_publishable" = 'False' ] && [ -n "$manifest_reason" ] && [ "$manifest_reason" != 'stability_gap_not_met' ] && [ "$manifest_reason" != 'no_applicable_members' ]; then
              if [ "$manifest_reason" = 'validation_failed' ]; then
                if [ "$manifest_validator" = 'failed' ]; then
                  case "$manifest_validator_reason" in
                    schema_invalid|artifact_binding_mismatch|ledger_invalid|source_status_invalid|aggregate_mismatch|privacy_invariant_failed) state_ok=true ;;
                  esac
                fi
              elif [ "$manifest_validator" = 'not_run' ] && [ -z "$manifest_validator_reason" ]; then
                state_ok=true
              fi
            fi
            if [ "$state_ok" != true ]; then
              echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"
              echo 'exit_code=4' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"
            echo 'exit_code=4' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          uv run github-member-activity verify --run-dir "$artifact_path" --expected-manifest-sha256 "$manifest_sha"
          verify_code=$?
          set -e
          if [ "$collector_code" = 0 ] && [ "$verify_code" = 0 ]; then
            :
          elif [ "$collector_code" = 3 ] && [ "$verify_code" = 3 ]; then
            :
          elif [ "$collector_code" = 4 ] && [ "$verify_code" = 3 ]; then
            :
          else
            echo 'artifact_ready=false' >> "$GITHUB_OUTPUT"
            echo 'exit_code=4' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'artifact_ready=true' >> "$GITHUB_OUTPUT"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
          echo "period_id=$period_id" >> "$GITHUB_OUTPUT"
          echo "period_utc_slug=$period_utc_slug" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$manifest_sha" >> "$GITHUB_OUTPUT"
          echo "exit_code=$collector_code" >> "$GITHUB_OUTPUT"
      - name: Upload verified artifact
        id: upload
        if: always() && steps.collect.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-member-activity-${{ steps.collect.outputs.period_id }}-${{ steps.collect.outputs.period_utc_slug }}-${{ steps.collect.outputs.manifest_sha256 }}
          path: ${{ steps.collect.outputs.artifact_path }}
          if-no-files-found: error
      - name: Final gate
        if: always()
        run: |
          code="${{ steps.collect.outputs.exit_code || '4' }}"
          if [ "${{ steps.collect.outputs.artifact_ready }}" = 'true' ] && [ "${{ steps.upload.outcome }}" != 'success' ]; then
            code=4
          fi
          case "$code" in 0|2|3|4) exit "$code";; *) exit 4;; esac
