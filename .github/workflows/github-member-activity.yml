name: GitHub member activity

on:
  workflow_dispatch:
    inputs:
      period:
        description: Completed period to collect
        required: true
        type: choice
        options: [weekly, monthly]
  schedule:
    - cron: '15 1 * * 2'
    - cron: '30 1 2 * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: github-member-activity
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@6b9c6063abd4a2e6e5c9c6d6d0c7d25f4c0b0c21
      - name: Install locked environment
        run: uv sync --locked
      - name: Test
        run: uv run pytest
      - id: collect
        name: Collect and verify
        env:
          PUBLIC_GITHUB_TOKEN: ${{ secrets.PUBLIC_GITHUB_TOKEN }}
          PUBLIC_GITHUB_MEMBER_ACTIVITY_CONFIG: ${{ secrets.PUBLIC_GITHUB_MEMBER_ACTIVITY_CONFIG }}
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SCHEDULE: ${{ github.event.schedule }}
          WORKFLOW_DISPATCH_PERIOD: ${{ inputs.period }}
        run: |
          scripts/workflow_wrapper.sh
      - name: Upload verified artifact
        id: upload
        if: always() && steps.collect.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-member-activity-${{ steps.collect.outputs.period_id }}-${{ steps.collect.outputs.period_utc_slug }}-${{ steps.collect.outputs.manifest_sha256 }}
          path: ${{ steps.collect.outputs.artifact_path }}
          if-no-files-found: error
      - name: Final gate
        if: always()
        env:
          COLLECT_EXIT_CODE: ${{ steps.collect.outputs.exit_code || '4' }}
          ARTIFACT_READY: ${{ steps.collect.outputs.artifact_ready }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: scripts/final_gate.sh
