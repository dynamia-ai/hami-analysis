name: project-hami-weekly-report

on:
  pull_request:
    paths:
      - "project-hami-weekly-report/**"
      - ".github/workflows/project-hami-weekly-report.yml"
  push:
    paths:
      - "project-hami-weekly-report/**"
      - ".github/workflows/project-hami-weekly-report.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-hami-weekly-report
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run pytest
